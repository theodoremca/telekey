        <rect x="4" y="10" width="26" height="9" rx="4.5" fill="#f5b324"/>
      </g>
    </svg>
    <text x="80" y="45" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.2" fill="#f2f0f7">TeleKey</text>
  </g>

  <!-- The claim -->
  <g font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="112" letter-spacing="-4">
    <text x="68" y="278" fill="#f2f0f7">Hold a key.</text>
    <text x="68" y="388" fill="#f2f0f7">Speak.</text>
    <text x="68" y="498" fill="#f5b324">It's typed.</text>
  </g>

