<!-- The link preview for telekey.app (public/og.png, 1200 x 630). Regenerate the PNG
     by rendering this file in a browser with the three Google Fonts below loaded:
     Bricolage Grotesque 700, Geist 400, JetBrains Mono 500. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="desk" cx="50%" cy="0%" r="95%" fx="50%" fy="0%" gradientTransform="translate(0 0) scale(1 1)">
      <stop offset="0" stop-color="#24222f"/>
      <stop offset="0.62" stop-color="#15141b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5b324" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5b324" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#15141b"/>
  <rect width="1200" height="630" fill="url(#desk)"/>
  <ellipse cx="975" cy="330" rx="330" ry="300" fill="url(#glow)"/>

  <!-- The mark and the name -->
  <g transform="translate(72 52)">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <rect x="13.5" y="40" width="7" height="9" rx="2" fill="#f5b324"/>
      <rect x="4" y="48" width="56" height="8" rx="4" fill="#f2f0f7"/>
      <rect x="42" y="36" width="10" height="14" rx="3" fill="#f2f0f7"/>
