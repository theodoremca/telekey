<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeleKey — overlay states</title>
    <!-- Loads the real stylesheet, so this page cannot drift from the app. -->
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
    <style>
      body {
        pointer-events: auto;
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: #1b1a21;
        overflow: auto;
      }
      .sheet {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px 72px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .note {
        margin: 0 0 36px;
        font-size: 13px;
        line-height: 1.5;
        color: #6b6875;
      }
      .row {
        margin-bottom: 28px;
      }
      .label {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #8c8996;
      }
      .plate {
        display: grid;
        place-items: center;
        padding: 10px 0;
        border-radius: 14px;
        /* Ruled paper, so the capsule is judged over real content rather than
           a flat swatch. */
        background: repeating-linear-gradient(
          #ffffff 0 22px,
          #eceaf1 22px 23px
        );
        border: 1px solid #e6e4ea;
      }
      /* The real window's size, so where the capsule and the pill sit in it
         is what the app shows. */
      .plate .stage {
        width: 296px;
        height: 88px;
      }
      .plate.dark {
        background: repeating-linear-gradient(
          #1c1b22 0 22px,
          #26252e 22px 23px
        );
        border-color: #2c2b34;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <h1>Overlay states</h1>
      <p class="note">
        Design reference for the recording panel. Pulls in the app's own
        stylesheet, so anything you change in
        <code>src/overlay/overlay.css</code> shows up here on reload.
      </p>
      <div id="rows"></div>
    </div>

    <template id="capsule-template">
      <div class="stage" data-view="capsule">
        <div class="capsule" data-state="recording">
          <span class="indicator"></span>
          <div class="trace">
            <canvas width="342" height="60"></canvas>
            <div class="sweep"></div>
          </div>
          <span class="timer">0:07</span>
          <p class="message"></p>
          <button type="button" class="stop" tabindex="-1" aria-label="Stop and paste">
            <span aria-hidden="true"></span>
          </button>
          <button type="button" class="cancel" tabindex="-1" aria-label="Cancel dictation">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <button type="button" class="pill" data-hover="false" tabindex="-1" aria-label="Start dictating">
          <span class="pill-body">
            <span class="mic" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M6 11a6 6 0 0 0 12 0M12 17v4" />
              </svg>
            </span>
            <span class="pill-hint">Click to dictate</span>
            <span class="pill-keys">⌃ ⌥ Space</span>
          </span>
        </button>
      </div>
    </template>

    <script type="module" src="/src/overlay/preview.ts"></script>
  </body>
</html>
