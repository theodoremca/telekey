[package]
name = "telekey"
version = "0.3.0"
description = "Push-to-talk dictation for macOS"
authors = ["Theodore"]
edition = "2021"

[lib]
name = "telekey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# audio capture + resampling + encoding
cpal = "0.18"
rubato = "5.0"


# transcription
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "multipart",
  "json",
  "form",
  "rustls",
  "rustls-native-certs",
  "charset",
  "http2",
] }

# Instant mode: a WebSocket to OpenAI's live transcription, or to TeleKey's
# relay. Blocking, on its own thread per dictation, like the rest of the
# pipeline; TLS through the same rustls (and aws-lc-rs) reqwest already uses.
tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
  "rustls-tls-native-roots",
] }
base64 = "0.22"

# Replacements ("when I say … write …"); already compiled in through
# tracing-subscriber, so this costs nothing new.
regex = "1.10"

# text injection
enigo = "0.6"
arboard = "3.6"

# storage
keyring = "4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
dotenvy = "0.15"

# misc
anyhow = "1"
thiserror = "2"
zeroize = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Updates (update.rs). Without its default "rustls-tls", which turns on rustls's
# ring backend beside the aws-lc-rs one reqwest uses: with two backends rustls
# cannot pick a default, and tungstenite's wss:// handshake (Instant) panics.
# The plugin's HTTP client is the same reqwest as ours, so it gets our TLS.
tauri-plugin-updater = { version = "2", default-features = false, features = ["zip", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace",
  "NSRunningApplication",
  "NSApplication",
  "NSWindow",
  "NSPanel",
  "NSResponder",
] }
objc2-core-graphics = { version = "0.3", features = [
  "CGEvent",
  "CGEventTypes",
  "CGRemoteOperation",
] }
objc2-core-foundation = { version = "0.3", features = [
  "CFMachPort",
  "CFRunLoop",
  "CFString",
  "CFNumber",
] }
# Screen context: reading the focused window's title and the text around the
# cursor through the Accessibility API, under the grant pasting already has.
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXUIElement",
  "AXValue",
  "AXError",
] }
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSArray",
  "NSDictionary",
  "NSValue",
] }
objc2-av-foundation = { version = "0.3", features = [
  "AVCaptureDevice",
  "AVMediaFormat",
] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["AudioHardware", "std"] }

# Windows and Linux open a telekey:// link by starting a second copy of the app
# with the link as its argument. This hands the link to the copy already
# running instead; macOS needs nothing, LaunchServices delivers it in place.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Registry",
] }

[dev-dependencies]
# Only to ask rustls, in a test, whether it can still pick a crypto backend.
rustls = { version = "0.23", default-features = false }
# The updater's own signature check, to test the key in tauri.conf.json.
minisign-verify = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
hound = "3.5"
wiremock = "0.6"
tempfile = "3"
