  <text x="975" y="294" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-weight="500" font-size="104" fill="#15141b">fn</text>

  <!-- The capsule that appears while you hold it -->
  <rect x="840" y="440" width="270" height="64" rx="32" fill="#211f2b" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#f5b324">
