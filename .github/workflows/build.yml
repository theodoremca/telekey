name: build

# Builds on macOS and Windows, and compiles on Linux, so a change that only
# compiles on macOS is caught here rather than by whoever next clones the repo
# on Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: |
          bun run tsc --noEmit
          bun test
      - name: Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: build (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            bundles: app
          - os: windows-latest
            label: Windows
            # NSIS rather than MSI: MSI additionally needs the VBSCRIPT optional
            # Windows feature, which the hosted runners do not enable.
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: bun install --frozen-lockfile

      # Unsigned on purpose. Signing needs certificates that do not belong in
      # CI secrets for a personal project; these artifacts are for verifying the
      # build compiles and bundles, not for distribution.
      - name: Build
        run: bun tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: telekey-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

  # Linux is offered but untested: nothing here runs its tests or its window
  # code. What this does is compile it, because the overlay's focus handling,
  # the paste keystroke and the tray are cfg-gated per OS and only the Linux
  # compiler checks the Linux branches. The same libraries as release.yml.
  linux:
    name: compile (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libasound2-dev libdbus-1-dev \
            build-essential pkg-config patchelf file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ubuntu-22.04

      - name: Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # The Functions API and the Instant relay hold the money code (pricing, the
  # ledger, the upload check), and their tests also pin the half of the
  # recording-format contract the server owns (functions/test/fixtures,
  # matched byte for byte by a Rust test in audio.rs). They are deployed by
  # hand, so this is the only thing that runs them on every push. The relay's
  # tests import the shared ledger from functions/src, so functions installs
  # first.
  backend:
    name: tests (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Functions
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Relay
        working-directory: relay
        run: |
          npm ci
          npm test
          npx tsc --noEmit

  # The website is deployed by hand from web/ (CLAUDE.md), so nothing else
  # builds it before a release goes out. This does, on every push. It needs no
  # secrets: the Firebase key and API base are NEXT_PUBLIC_ values read from
  # .env files that are not committed, and the login page copes with a build
  # that lacks them (it says sign-in is not configured). The build type-checks
  # the pages too. web/ has its own lockfile, so it installs on its own, from
  # its own directory.
  website:
    name: build (website)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Next.js build
        run: bun run build
